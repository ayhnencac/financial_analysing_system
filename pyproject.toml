[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-platform"
version = "0.1.0"
description = "Evidence-first agent runtime for seven financial research tasks"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
documents = ["pypdf>=5,<7", "pdfplumber>=0.11,<1"]
spreadsheets = ["openpyxl>=3.1,<4"]
ocr = ["Pillow>=10,<12", "pytesseract>=0.3.10,<1"]

[project.scripts]
finagent = "finagent.cli:main"

[tool.setuptools.packages.find]
include = ["finagent*"]

[tool.setuptools.package-data]
finagent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
